<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 14">
  <defs>
    <clipPath id="uk-clip">
      <rect width="20" height="14" rx="2.5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#uk-clip)">

    <rect width="20" height="14" fill="#012169"/>

    <line x1="0" y1="0"  x2="20" y2="14" stroke="#fff"     stroke-width="4.2"/>
    <line x1="20" y1="0" x2="0"  y2="14" stroke="#fff"     stroke-width="4.2"/>

    <line x1="0"  y1="0"  x2="10" y2="7"  stroke="#C8102E" stroke-width="1.8"/>
    <line x1="10" y1="7"  x2="20" y2="14" stroke="#C8102E" stroke-width="1.8" transform="translate(0.9,-0.9)"/>

    <line x1="20" y1="0"  x2="10" y2="7"  stroke="#C8102E" stroke-width="1.8"/>
    <line x1="10" y1="7"  x2="0"  y2="14" stroke="#C8102E" stroke-width="1.8" transform="translate(-0.9,-0.9)"/>

    <line x1="10" y1="0"  x2="10" y2="14" stroke="#fff"     stroke-width="4.4"/>
    <line x1="0"  y1="7"  x2="20" y2="7"  stroke="#fff"     stroke-width="4.4"/>

    <line x1="10" y1="0"  x2="10" y2="14" stroke="#C8102E" stroke-width="2.6"/>
    <line x1="0"  y1="7"  x2="20" y2="7"  stroke="#C8102E" stroke-width="2.6"/>

  </g>
</svg>
