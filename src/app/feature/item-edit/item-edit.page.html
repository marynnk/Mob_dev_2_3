<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/item"></ion-back-button>
        </ion-buttons>
        <ion-title>{{ (isEdit ? 'ITEM_EDIT.TITLE_EDIT' : 'ITEM_EDIT.TITLE_NEW') | translate }}</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <div class="page-bg">
        <div class="form-card">
            <form [formGroup]="form" (ngSubmit)="save()" novalidate>

                <div class="field-group">
                    <ion-input
                        fill="outline"
                        type="text"
                        [label]="'ITEM_EDIT.TASK_LABEL' | translate"
                        labelPlacement="stacked"
                        [placeholder]="'ITEM_EDIT.TASK_PLACEHOLDER' | translate"
                        [maxlength]="100"
                        [counter]="true"
                        formControlName="title"
                        [errorText]="fieldError('title')"
                        [class.ion-invalid]="fieldInvalid('title')"
                        [class.ion-touched]="form.get('title')?.touched"
                    />
                </div>

                <div class="field-group">
                    <ion-input
                        fill="outline"
                        type="datetime-local"
                        [label]="'ITEM_EDIT.DUE_LABEL' | translate"
                        labelPlacement="stacked"
                        formControlName="dueDate"
                        [min]="minDate"
                        [errorText]="fieldError('dueDate')"
                        [class.ion-invalid]="fieldInvalid('dueDate')"
                        [class.ion-touched]="form.get('dueDate')?.touched"
                    />
                </div>

                <div class="field-group">
                    <ion-select formControlName="type" [label]="'ITEM_EDIT.TYPE_LABEL' | translate" label-placement="stacked"
                                interface="popover" [placeholder]="'ITEM_EDIT.TYPE_PLACEHOLDER' | translate">
                        @for(type of TASK_TYPES; track type) {
                            <ion-select-option value="{{type}}">{{`TASK_TYPE.${type.toUpperCase()}` | translate}}</ion-select-option>
                        }
                    </ion-select>
                </div>

                <div class="field-group">
                    <ion-input
                        fill="outline"
                        type="text"
                        [label]="'ITEM_EDIT.LOCATION_LABEL' | translate"
                        labelPlacement="stacked"
                        [placeholder]="'ITEM_EDIT.LOCATION_PLACEHOLDER' | translate"
                        (click)="openLocationPicker()"
                        [value]="form.get('location')?.value?.address"
                        readonly
                    >
                        <ion-icon slot="end" name="location-outline" aria-hidden="true" size="small"/>
                    </ion-input>
                </div>

                <div class="field-group">
                    <ion-textarea
                        fill="outline"
                        [label]="'ITEM_EDIT.DESC_LABEL' | translate"
                        labelPlacement="stacked"
                        [placeholder]="'ITEM_EDIT.DESC_PLACEHOLDER' | translate"
                        rows="4"
                        [maxlength]="100"
                        [counter]="true"
                        formControlName="description"
                        [errorText]="fieldError('description')"
                        [class.ion-invalid]="fieldInvalid('description')"
                        [class.ion-touched]="form.get('description')?.touched"
                    ></ion-textarea>
                </div>

                <div class="field-group photos">
                    <div class="photos-label">{{ 'ITEM_EDIT.PHOTOS_LABEL' | translate }}</div>
                    <app-photo-grid
                        [photos]="photos"
                        [pendingPhotos]="pendingPhotos"
                        (openPhoto)="openPhoto($event)"
                        (addPhoto)="addPhoto($event)"
                        (removeNewPhoto)="removePendingPhoto($event)"
                        (removeExistingPhoto)="removeExistingPhoto($event)"/>
                </div>

                <ion-button expand="block" type="submit" class="submit-btn" [disabled]="isSaving">
                    @if (isSaving) {
                        <ion-spinner name="crescent" slot="start"></ion-spinner>
                    } @else {
                        <ion-icon slot="start" name="save-outline"></ion-icon>
                    }
                    {{ 'ITEM_EDIT.SAVE' | translate }}
                </ion-button>

            </form>
        </div>
    </div>
</ion-content>

<app-photo-view [photoUrl]="selectedPhotoUrl!" (closeViewer)="closePhoto()"/>
