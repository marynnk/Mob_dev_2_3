<ion-content [fullscreen]="true">
    <div class="auth-bg">
        <div class="auth-card">
            <div class="auth-logo">
                <ion-icon name="enter-outline"></ion-icon>
            </div>
            <h1 class="auth-title">{{ 'LOGIN.TITLE' | translate }}</h1>
            <p class="auth-subtitle">{{ 'LOGIN.SUBTITLE' | translate }}</p>
            <app-language-switcher class="language-switcher"/>
            <form [formGroup]="form" (ngSubmit)="onLogin()" novalidate>
                <div class="field-group">
                    <ion-input
                        fill="outline"
                        type="email"
                        [label]="'COMMON.EMAIL_LABEL' | translate"
                        labelPlacement="stacked"
                        inputmode="email"
                        autocomplete="email"
                        [placeholder]="'COMMON.EMAIL_PLACEHOLDER' | translate"
                        formControlName="email"
                        [errorText]="emailError()"
                        [class.ion-invalid]="email.invalid && email.touched"
                        [class.ion-touched]="email.touched"
                    >
                        <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
                    </ion-input>
                </div>

                <div class="field-group">
                    <ion-input
                        fill="outline"
                        [label]="'COMMON.PASSWORD_LABEL' | translate"
                        labelPlacement="stacked"
                        autocomplete="current-password"
                        [placeholder]="'COMMON.PASSWORD_PLACEHOLDER' | translate"
                        formControlName="password"
                        [errorText]="passwordError()"
                        [class.ion-invalid]="password.invalid && password.touched"
                        [class.ion-touched]="password.touched"
                    >
                        <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
                        <ion-input-password-toggle slot="end" hide-icon="eye-off-outline" show-icon="eye-outline"/>
                    </ion-input>
                </div>

                @if (error) {
                    <div class="error-banner">{{ error }}</div>
                }

                <ion-button expand="block" type="submit" class="submit-btn" [disabled]="loading">
                    @if (loading) {
                        <ion-spinner name="crescent"></ion-spinner>
                    } @else {
                        {{ 'LOGIN.SUBMIT' | translate }}
                    }
                </ion-button>

            </form>

            <p class="auth-link">
                {{ 'LOGIN.NO_ACCOUNT' | translate }}
                <button type="button" class="link-btn" (click)="goToRegister()">{{ 'LOGIN.REGISTER_LINK' | translate }}</button>
            </p>

            <p class="auth-link">
                <button type="button" class="link-btn" (click)="goToForgotPassword()">{{ 'LOGIN.FORGOT_PASSWORD' | translate }}</button>
            </p>

        </div>
    </div>
</ion-content>
