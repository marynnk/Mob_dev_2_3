<ion-content [fullscreen]="true">
    <div class="auth-bg">
        <div class="auth-card">

            <div class="auth-logo">
                <ion-icon name="person-add-outline"/>
            </div>

            <h1 class="auth-title">{{ 'REGISTER.TITLE' | translate }}</h1>
            <p class="auth-subtitle">{{ 'REGISTER.SUBTITLE' | translate }}</p>

            <form [formGroup]="form" (ngSubmit)="onRegister()" novalidate>

                <div class="field-group">
                    <ion-input
                        fill="outline"
                        type="text"
                        [label]="'REGISTER.NAME_LABEL' | translate"
                        labelPlacement="stacked"
                        autocomplete="username"
                        [placeholder]="'REGISTER.NAME_PLACEHOLDER' | translate"
                        formControlName="displayName"
                        [errorText]="fieldError('displayName')"
                        [class.ion-invalid]="controls.displayName.invalid && controls.displayName.touched"
                        [class.ion-touched]="controls.displayName.touched"
                    >
                        <ion-icon slot="start" name="person-outline" aria-hidden="true"/>
                    </ion-input>
                </div>

                <div class="field-group">
                    <ion-input
                        fill="outline"
                        type="email"
                        [label]="'COMMON.EMAIL_LABEL' | translate"
                        labelPlacement="stacked"
                        inputmode="email"
                        autocomplete="email"
                        [placeholder]="'COMMON.EMAIL_PLACEHOLDER' | translate"
                        formControlName="email"
                        [errorText]="fieldError('email')"
                        [class.ion-invalid]="controls.email.invalid && controls.email.touched"
                        [class.ion-touched]="controls.email.touched"
                    >
                        <ion-icon slot="start" name="mail-outline" aria-hidden="true"/>
                    </ion-input>
                </div>

                <div class="field-group">
                    <ion-input
                        fill="outline"
                        [type]="'password'"
                        [label]="'COMMON.PASSWORD_LABEL' | translate"
                        labelPlacement="stacked"
                        autocomplete="new-password"
                        [placeholder]="'REGISTER.PASSWORD_PLACEHOLDER' | translate"
                        formControlName="password"
                        [errorText]="fieldError('password')"
                        [class.ion-invalid]="controls.password.invalid && controls.password.touched"
                        [class.ion-touched]="controls.password.touched"
                    >
                        <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"/>
                        <ion-input-password-toggle slot="end" hide-icon="eye-off-outline" show-icon="eye-outline"/>
                    </ion-input>
                </div>

                <div class="field-group">
                    <ion-input
                        fill="outline"
                        [type]="'password'"
                        [label]="'REGISTER.CONFIRM_LABEL' | translate"
                        labelPlacement="stacked"
                        autocomplete="new-password"
                        [placeholder]="'COMMON.CONFIRM_PLACEHOLDER' | translate"
                        formControlName="confirmPassword"
                        [errorText]="fieldError('confirmPassword')"
                        [class.ion-invalid]="(controls.confirmPassword.invalid && (controls.confirmPassword.touched || controls.confirmPassword.dirty))"
                        [class.ion-touched]="controls.confirmPassword.touched || controls.confirmPassword.dirty"
                    >
                        <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"/>
                        <ion-input-password-toggle slot="end" hide-icon="eye-off-outline" show-icon="eye-outline"/>
                    </ion-input>
                </div>

                <div class="section-divider"><span>{{ 'REGISTER.EXTRA_SECTION' | translate }}</span></div>

                <div class="field-group">
                    <ion-input
                        fill="outline"
                        type="tel"
                        [label]="'REGISTER.PHONE_LABEL' | translate"
                        labelPlacement="stacked"
                        inputmode="tel"
                        autocomplete="tel"
                        [placeholder]="'REGISTER.PHONE_PLACEHOLDER' | translate"
                        formControlName="phone"
                        [errorText]="fieldError('phone')"
                        [class.ion-invalid]="controls.phone.invalid && controls.phone.touched"
                        [class.ion-touched]="controls.phone.touched"
                    >
                        <ion-icon slot="start" name="call-outline" aria-hidden="true"/>
                    </ion-input>
                </div>

                <div class="field-group">
                    <ion-input
                        fill="outline"
                        type="date"
                        [label]="'REGISTER.BIRTH_LABEL' | translate"
                        labelPlacement="stacked"
                        formControlName="dateOfBirth"
                    >
                        <ion-icon slot="start" name="calendar-outline" aria-hidden="true"/>
                    </ion-input>
                </div>

                <div class="field-group">
                    <ion-textarea
                        fill="outline"
                        [label]="'REGISTER.BIO_LABEL' | translate"
                        labelPlacement="stacked"
                        rows="3"
                        [counter]="true"
                        [maxlength]="200"
                        [placeholder]="'REGISTER.BIO_PLACEHOLDER' | translate"
                        formControlName="bio"
                        [errorText]="fieldError('bio')"
                        [class.ion-invalid]="controls.bio.invalid && controls.bio.touched"
                        [class.ion-touched]="controls.bio.touched"
                    >
                        <ion-icon slot="start" name="chatbubble-outline" aria-hidden="true"/>
                    </ion-textarea>
                </div>

                @if (error) {
                    <div class="error-banner">{{ error }}</div>
                }

                <ion-button expand="block" type="submit" class="submit-btn" [disabled]="loading">
                    @if (loading) {
                        <ion-spinner name="crescent"/>
                    } @else {
                        {{ 'REGISTER.SUBMIT' | translate }}
                    }
                </ion-button>

            </form>

            <p class="auth-link">
                {{ 'REGISTER.HAS_ACCOUNT' | translate }}
                <button type="button" class="link-btn" (click)="goToLogin()">{{ 'REGISTER.LOGIN_LINK' | translate }}</button>
            </p>

        </div>
    </div>
</ion-content>
